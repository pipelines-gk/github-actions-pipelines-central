name: Wait for kpack Build

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
        description: "Docker registry URL (e.g., registry.digitalocean.com)"
      image_name:
        required: true
        type: string
        description: "Full image name (e.g., gainkode/handy-backend)"
      commit_sha:
        required: false
        type: string
        description: "Commit SHA being built"
      initial_delay:
        required: false
        type: number
        default: 20
        description: "Initial delay in seconds for kpack to detect changes"
      max_wait:
        required: false
        type: number
        default: 480
        description: "Maximum wait time in seconds"
      check_interval:
        required: false
        type: number
        default: 10
        description: "Check interval in seconds"
    secrets:
      DOCR_USERNAME:
        required: true
      DOCR_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  wait-build:
    runs-on: ubuntu-latest
    outputs:
      build_duration: ${{ steps.wait.outputs.duration }}
      image_digest: ${{ steps.wait.outputs.digest }}
      build_status: ${{ steps.wait.outputs.status }}
    steps:
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_PASSWORD }}

      - name: Wait for kpack build
        id: wait
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          INITIAL_DELAY: ${{ inputs.initial_delay }}
          MAX_WAIT: ${{ inputs.max_wait }}
          INTERVAL: ${{ inputs.check_interval }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
          START_TIME=$(date +%s)
          
          echo "⏳ Esperando que kpack termine el build..."
          if [ -n "$COMMIT_SHA" ]; then
            echo "   Commit SHA: ${COMMIT_SHA:0:7}"
          fi
          echo "   Imagen: $IMAGE"
          echo "   Timeout máximo: ${MAX_WAIT}s"
          
          # Delay inicial: dar tiempo a kpack para detectar el cambio y comenzar el build
          echo "⏸️  Esperando ${INITIAL_DELAY}s para que kpack detecte el cambio..."
          sleep $INITIAL_DELAY
          
          # Guardar timestamp y digest inicial para comparar
          OLD_DIGEST=""
          OLD_TIMESTAMP=""
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            OLD_DIGEST=$(docker manifest inspect "$IMAGE" 2>/dev/null | grep -oP '"digest":\s*"\K[^"]+' | head -1 || echo "")
            # Obtener timestamp de última modificación usando la API del registry
            OLD_TIMESTAMP=$(date +%s)
            if [ -n "$OLD_DIGEST" ]; then
              echo "📦 Digest inicial: ${OLD_DIGEST:0:20}..."
            fi
          else
            echo "📦 No hay imagen anterior (primera build o imagen eliminada)"
          fi
          
          # Estrategia mejorada: esperar tiempo mínimo para builds típicos (90s)
          # Luego verificar si la imagen existe y es accesible
          MIN_WAIT=90
          ELAPSED=$INITIAL_DELAY
          NEW_DIGEST=""
          IMAGE_READY=false
          DIGEST_CHANGED=false
          
          echo "🔍 Esperando build de kpack (mínimo ${MIN_WAIT}s para builds típicos)..."
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Verificar si la imagen latest existe y es accesible
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              NEW_DIGEST=$(docker manifest inspect "$IMAGE" 2>/dev/null | grep -oP '"digest":\s*"\K[^"]+' | head -1 || echo "")
              
              # Verificar si el digest cambió
              if [ -n "$OLD_DIGEST" ] && [ -n "$NEW_DIGEST" ] && [ "$OLD_DIGEST" != "$NEW_DIGEST" ]; then
                echo "✅ Digest cambió - nueva imagen detectada!"
                echo "   Digest anterior: ${OLD_DIGEST:0:20}..."
                echo "   Digest nuevo: ${NEW_DIGEST:0:20}..."
                DIGEST_CHANGED=true
                IMAGE_READY=true
                break
              fi
              
              # Si pasó el tiempo mínimo y la imagen existe, asumir que está lista
              # (kpack puede no cambiar el digest si el código es idéntico, pero la imagen existe)
              if [ $ELAPSED -ge $MIN_WAIT ]; then
                if [ -z "$OLD_DIGEST" ] || [ "$OLD_DIGEST" = "$NEW_DIGEST" ]; then
                  echo "✅ Tiempo mínimo alcanzado (${ELAPSED}s) - imagen existe y es accesible"
                  echo "   Digest: ${NEW_DIGEST:0:20}..."
                  echo "   Nota: Digest no cambió, pero imagen existe (puede ser build idéntico o kpack aún construyendo)"
                  IMAGE_READY=true
                  break
                fi
              fi
              
              if [ $ELAPSED -lt $MIN_WAIT ]; then
                echo "⏳ Esperando tiempo mínimo... (${ELAPSED}s/${MIN_WAIT}s)"
              else
                echo "⏳ Imagen existe, esperando cambio de digest... (${ELAPSED}s/${MAX_WAIT}s)"
              fi
            else
              echo "⏳ Imagen aún no disponible... (${ELAPSED}s/${MAX_WAIT}s)"
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          if [ "$IMAGE_READY" = "false" ]; then
            echo "⚠️  Timeout esperando build de kpack (${MAX_WAIT}s)"
            echo "   Esto puede significar que:"
            echo "   1. kpack aún está construyendo (builds muy largos)"
            echo "   2. kpack no detectó el cambio"
            echo "   3. El build falló"
            echo "   Continuando de todas formas - kpack puede terminar después..."
            echo "duration=${DURATION}" >> $GITHUB_OUTPUT
            echo "digest=" >> $GITHUB_OUTPUT
            echo "status=timeout" >> $GITHUB_OUTPUT
            # No hacer exit 1 - permitir que continúe el workflow
          else
            if [ "$DIGEST_CHANGED" = "true" ]; then
              echo "✅ Build completado - nueva imagen detectada en ${DURATION}s"
            else
              echo "✅ Imagen disponible después de ${DURATION}s (digest no cambió, pero imagen existe)"
            fi
            echo "duration=${DURATION}" >> $GITHUB_OUTPUT
            echo "digest=${NEW_DIGEST}" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          fi
