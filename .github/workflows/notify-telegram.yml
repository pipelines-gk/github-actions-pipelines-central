name: Telegram Notification Workflow

on:
  workflow_call:
    inputs:
      workflow_status:
        required: true
        type: string
      version:
        required: false
        type: string
        default: "N/A"
      project_name:
        required: false
        type: string
        default: ""
      build_duration:
        required: false
        type: string
        default: ""
      commit_message:
        required: false
        type: string
        default: ""
      branch_name:
        required: false
        type: string
        default: ""
      repository:
        required: false
        type: string
        default: ""
      run_id:
        required: false
        type: string
        default: ""
      run_url:
        required: false
        type: string
        default: ""

jobs:
  notify_telegram:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Map Telegram values
        id: vars
        run: |
          if [ "${{ inputs.workflow_status }}" = "success" ]; then
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "status_icon=🚀" >> $GITHUB_OUTPUT
          else
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "status_icon=💥" >> $GITHUB_OUTPUT
          fi

      - name: Prepare commit message
        id: commit
        env:
          COMMIT_MESSAGE_INPUT: ${{ inputs.commit_message }}
          COMMIT_MESSAGE_HEAD: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$COMMIT_MESSAGE_INPUT"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="$COMMIT_MESSAGE_HEAD"
          fi
          if [ -z "$MESSAGE" ]; then
            MESSAGE="Manual workflow dispatch"
          fi
          FIRST_LINE=$(echo "$MESSAGE" | head -n 1)
          CLEAN_MESSAGE=$(echo "$FIRST_LINE" | sed 's/[*_`\[\]]/\\&/g')
          echo "message=$CLEAN_MESSAGE" >> $GITHUB_OUTPUT

      - name: Calculate build duration
        id: duration
        run: |
          if [ -n "${{ inputs.build_duration }}" ]; then
            echo "duration=${{ inputs.build_duration }}" >> $GITHUB_OUTPUT
          else
            echo "duration=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Prepare metadata
        id: metadata
        run: |
          BRANCH="${{ inputs.branch_name }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          REPO="${{ inputs.repository }}"
          if [ -z "$REPO" ]; then
            REPO="${{ github.repository }}"
          fi
          echo "repository=$REPO" >> $GITHUB_OUTPUT
          
          RUN_URL="${{ inputs.run_url }}"
          if [ -z "$RUN_URL" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT
          
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="${{ github.run_id }}"
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        env:
          EMOJI: ${{ steps.vars.outputs.emoji }}
          WORKFLOW_STATUS: ${{ inputs.workflow_status }}
          PROJECT_NAME: ${{ inputs.project_name }}
          VERSION: ${{ inputs.version }}
          DURATION: ${{ steps.duration.outputs.duration }}
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
          BRANCH: ${{ steps.metadata.outputs.branch }}
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          RUN_ID: ${{ steps.metadata.outputs.run_id }}
          RUN_URL: ${{ steps.metadata.outputs.run_url }}
        run: |
          HEADER="$EMOJI *Deployment $WORKFLOW_STATUS*"

          PROJECT_INFO=""
          if [ -n "$PROJECT_NAME" ]; then
            PROJECT_INFO="%0A%0A📦 *Project:* \`$PROJECT_NAME\`"
          fi

          VERSION_INFO=""
          if [ "$VERSION" != "N/A" ]; then
            VERSION_INFO="%0A🏷️ *Version:* \`$VERSION\`"
          fi

          DURATION_INFO=""
          if [ "$DURATION" != "N/A" ]; then
            DURATION_INFO="%0A⏱️ *Duration:* $DURATION"
          fi

          TEXT="$HEADER$PROJECT_INFO$VERSION_INFO%0A%0A📝 *Commit:* $COMMIT_MSG%0A🌿 *Branch:* \`$BRANCH\`%0A📂 *Repository:* \`$REPOSITORY\`%0A🔢 *Run ID:* \`$RUN_ID\`$DURATION_INFO%0A%0A👉 [Ver detalles completos]($RUN_URL)"

          curl -s -X POST "https://api.telegram.org/bot7862171298:AAE_UGZmZlqbdjCGmFXub0knHtSDPVdrtrY/sendMessage" \
            -d chat_id=307567817 \
            -d parse_mode=Markdown \
            -d text="$TEXT" \
            -d disable_web_page_preview=true

