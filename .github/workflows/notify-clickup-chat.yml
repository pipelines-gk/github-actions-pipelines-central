name: ClickUp Chat Notification Workflow

on:
  workflow_call:
    inputs:
      workflow_status:
        required: true
        type: string
      version:
        required: false
        type: string
        default: "N/A"
      project_name:
        required: false
        type: string
        default: ""
      build_duration:
        required: false
        type: string
        default: ""
      commit_message:
        required: false
        type: string
        default: ""
      branch_name:
        required: false
        type: string
        default: ""
      repository:
        required: false
        type: string
        default: ""
      run_id:
        required: false
        type: string
        default: ""
      run_url:
        required: false
        type: string
        default: ""

jobs:
  notify_clickup:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Skip ClickUp notifications
        run: echo "ClickUp notifications disabled"

