name: ClickUp Chat Notification Workflow

on:
  workflow_call:
    inputs:
      workflow_status:
        required: true
        type: string
      version:
        required: false
        type: string
        default: "N/A"
      project_name:
        required: false
        type: string
        default: ""
      build_duration:
        required: false
        type: string
        default: ""

jobs:
  notify_clickup:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Map ClickUp values
        id: vars
        run: |
          if [ "${{ inputs.workflow_status }}" = "success" ]; then
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "status_text=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "status_text=FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Prepare commit message
        id: commit
        env:
          COMMIT_MESSAGE_HEAD: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$COMMIT_MESSAGE_HEAD"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="Manual workflow dispatch"
          fi
          CLEAN_MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "message=$CLEAN_MESSAGE" >> $GITHUB_OUTPUT

      - name: Build notification message
        id: message
        env:
          EMOJI: ${{ steps.vars.outputs.emoji }}
          STATUS_TEXT: ${{ steps.vars.outputs.status_text }}
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
          PROJECT_NAME: ${{ inputs.project_name }}
          VERSION: ${{ inputs.version }}
          DURATION: ${{ inputs.build_duration }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          GITHUB_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"

          MESSAGE="$EMOJI **Deployment $STATUS_TEXT**\n\n"
          MESSAGE+="---\n\n"

          if [ -n "$PROJECT_NAME" ]; then
            MESSAGE+="📦 **Project:** \`$PROJECT_NAME\`\n"
          fi

          if [ "$VERSION" != "N/A" ]; then
            MESSAGE+="🏷️ **Version:** \`$VERSION\`\n"
          fi

          MESSAGE+="\n**Build Information:**\n"
          MESSAGE+="• 📝 **Commit:** $COMMIT_MSG\n"
          MESSAGE+="• 🌿 **Branch:** \`$BRANCH\`\n"
          MESSAGE+="• 📂 **Repository:** \`$REPOSITORY\`\n"
          MESSAGE+="• 🔢 **Run ID:** \`$RUN_ID\`\n"

          if [ -n "$DURATION" ] && [ "$DURATION" != "" ]; then
            MESSAGE+="• ⏱️ **Duration:** $DURATION\n"
          fi

          MESSAGE+="\n👉 [View full details on GitHub]($GITHUB_URL)"

          MESSAGE_JSON=$(echo "$MESSAGE" | sed 's/"/\\"/g')
          echo "content=$MESSAGE_JSON" >> $GITHUB_OUTPUT

      - name: Send ClickUp Chat Notification
        env:
          API_KEY: pk_94738230_DDW5KAZV4KKOQVPNO6D4CWNGYMY2FG6U
          WORKSPACE_ID: "90151289626"
          CHANNEL_ID: "2kypz0ru-10335"
        run: |
          echo "🚀 Sending ClickUp notification..."

          JSON_DATA=$(printf '{"content": "%s", "content_format": "text/md"}' "${{ steps.message.outputs.content }}")

          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_DATA" \
            "https://api.clickup.com/api/v3/workspaces/$WORKSPACE_ID/chat/channels/$CHANNEL_ID/messages")

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ ClickUp notification sent successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ ClickUp notification failed (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE"
            exit 1
          fi

