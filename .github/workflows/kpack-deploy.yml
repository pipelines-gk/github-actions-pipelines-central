name: kpack Deploy Workflow

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name (e.g., handy-backend)"
      registry:
        required: false
        type: string
        default: "registry.digitalocean.com"
        description: "Docker registry URL"
      image_name:
        required: false
        type: string
        description: "Image name without registry (defaults to gainkode/{project_name})"
      workdir:
        required: false
        type: string
        default: "."
        description: "Working directory for Release Please"
      gitops_repo:
        required: true
        type: string
        description: "GitOps repository (e.g., pipelines-gk/kubernetes)"
      gitops_path:
        required: true
        type: string
        description: "Path to kustomization.yaml in GitOps repo"
      gitops_image_key:
        required: true
        type: string
        description: "Image key in kustomization.yaml to update"
    secrets:
      GH_TOKEN:
        required: true
      DOCR_USERNAME:
        required: true
      DOCR_PASSWORD:
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: kpack-deploy-${{ inputs.project_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.create_tag.outputs.version || steps.extract_version.outputs.version || '0.0.0' }}
      sha_short: ${{ steps.commit.outputs.sha_short }}
      sha_full: ${{ steps.commit.outputs.sha_full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Get commit SHA
        id: commit
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          SHA_FULL=$(git rev-parse HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "sha_full=$SHA_FULL" >> $GITHUB_OUTPUT
          echo "📦 Commit SHA corto: $SHA_SHORT"
          echo "📦 Commit SHA completo: $SHA_FULL"

      - name: Run Release Please (version only)
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          release-type: simple
          path: ${{ inputs.workdir }}
          skip-github-release: true
          skip-github-pull-request: true

      - name: Extract version from Release Please
        id: extract_version
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
            echo "No version from Release Please, will use smart versioning"
          fi
          echo "BASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag with smart versioning
        id: create_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global advice.detachedHead false
          
          BASE_VERSION="${{ env.BASE_VERSION }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          
          if [ "$BASE_VERSION" = "0.0.0" ]; then
            LAST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -1)
            if [ -z "$LAST_TAG" ]; then
              LAST_TAG="v0.0.0"
            fi
            LAST_TAG_NO_V="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG_NO_V"
            echo "Using last tag as base: v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          VERSION_PREFIX="v${MAJOR}.${MINOR}."
          ALL_TAGS=$(git ls-remote --tags origin | cut -f2 | sed 's|refs/tags/||' | grep "^${VERSION_PREFIX}" || true)
          
          if [ -z "$ALL_TAGS" ]; then
            FINAL_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            MAX_PATCH=$(echo "$ALL_TAGS" | sed "s|^${VERSION_PREFIX}||" | grep -E '^[0-9]+$' | sort -n | tail -1)
            if [ -z "$MAX_PATCH" ]; then
              MAX_PATCH=0
            fi
            FINAL_VERSION="${MAJOR}.${MINOR}.$((MAX_PATCH + 1))"
          fi
          
          echo "Computed version: v${FINAL_VERSION}"
          echo "📦 Setting output version to: ${FINAL_VERSION}"
          
          # Establecer el output ANTES de intentar crear el tag
          # Esto asegura que siempre tengamos una versión, incluso si el tag falla
          echo "VERSION=${FINAL_VERSION}" >> $GITHUB_ENV
          echo "version=${FINAL_VERSION}" >> $GITHUB_OUTPUT
          
          # Verificar que el output se estableció correctamente
          if [ -z "${FINAL_VERSION}" ]; then
            echo "❌ Error: FINAL_VERSION is empty!"
            exit 1
          fi
          echo "✅ Output version set successfully: ${FINAL_VERSION}"
          
          for i in 1 2 3; do
            TAG_NAME="v${FINAL_VERSION}"
            if git tag "$TAG_NAME" 2>/dev/null && git push origin "$TAG_NAME" 2>/dev/null; then
              echo "Tag created successfully: $TAG_NAME"
              # Actualizar el output con la versión final que se usó
              echo "version=${FINAL_VERSION}" >> $GITHUB_OUTPUT
              exit 0
            fi
            git tag -d "$TAG_NAME" 2>/dev/null || true
            IFS='.' read -r M N P <<< "${FINAL_VERSION}"
            FINAL_VERSION="${M}.${N}.$((P + 1))"
            echo "Tag collision, retrying with v${FINAL_VERSION} (attempt $i/3)"
            # Actualizar el output con la nueva versión en cada intento
            echo "version=${FINAL_VERSION}" >> $GITHUB_OUTPUT
            if [ $i -lt 3 ]; then
              sleep 1
            fi
          done
          echo "⚠️  Failed to create tag after 3 attempts, but version ${FINAL_VERSION} will be used"
          # El output ya está establecido con la última versión intentada
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  check-digest:
    needs: versioning
    runs-on: ubuntu-latest
    outputs:
      has_new_image: ${{ steps.compare.outputs.has_new_image }}
      build_digest: ${{ steps.build_digest.outputs.build_digest }}
      last_digest: ${{ steps.last_digest.outputs.last_digest }}
    steps:
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_PASSWORD }}

      - name: Get last published version
        id: last_version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CURRENT_VERSION: v${{ needs.versioning.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Obtener la última versión publicada desde Git tags usando GitHub API
          # Más confiable que git ls-remote cuando no tenemos acceso directo al repo
          echo "🔍 Buscando última versión publicada (excluyendo ${CURRENT_VERSION})..."
          
          # Usar GitHub API para obtener tags
          TAGS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/tags" | \
            grep -oP '"name":\s*"v\d+\.\d+\.\d+"' | \
            grep -oP 'v\d+\.\d+\.\d+' | \
            grep -v "^${CURRENT_VERSION}$" | \
            sort -V | tail -1 || echo "")
          
          if [ -z "$TAGS" ]; then
            echo "⚠️ No hay versiones anteriores (primera release)"
            echo "last_version=" >> $GITHUB_OUTPUT
            echo "is_first_release=true" >> $GITHUB_OUTPUT
          else
            LAST_TAG="${TAGS#v}"  # Remover el prefijo 'v'
            echo "📦 Última versión publicada: v${LAST_TAG}"
            echo "last_version=${LAST_TAG}" >> $GITHUB_OUTPUT
            echo "is_first_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Read build digest from kpack
        id: build_digest
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name || format('gainkode/{0}', inputs.project_name) }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
          
          echo "🔍 Leyendo digest de imagen de kpack:"
          echo "   ${IMAGE}"
          
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "❌ Error: No se pudo leer el digest de :latest"
            echo "Esto puede significar que kpack aún no ha terminado el build"
            exit 1
          fi
          
          BUILD_DIGEST=$(docker manifest inspect "$IMAGE" 2>/dev/null | grep -oP '"digest":\s*"\K[^"]+' | head -1)
          
          if [ -z "$BUILD_DIGEST" ]; then
            echo "❌ No se pudo extraer el digest de :latest"
            exit 1
          fi
          
          echo "✅ Digest de build (kpack): ${BUILD_DIGEST:0:20}..."
          echo "build_digest=${BUILD_DIGEST}" >> $GITHUB_OUTPUT

      - name: Read last published version digest
        id: last_digest
        if: steps.last_version.outputs.is_first_release == 'false'
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name || format('gainkode/{0}', inputs.project_name) }}
          LAST_VERSION: ${{ steps.last_version.outputs.last_version }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:v${LAST_VERSION}"
          
          echo "🔍 Leyendo digest de la última versión publicada:"
          echo "   ${IMAGE}"
          
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "⚠️ No se pudo leer la última versión (puede no existir en registry)"
            echo "last_digest=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LAST_DIGEST=$(docker manifest inspect "$IMAGE" 2>/dev/null | grep -oP '"digest":\s*"\K[^"]+' | head -1)
          
          if [ -z "$LAST_DIGEST" ]; then
            echo "⚠️ No se pudo extraer el digest de la última versión"
            echo "last_digest=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ Digest última versión (v${LAST_VERSION}): ${LAST_DIGEST:0:20}..."
          echo "last_digest=${LAST_DIGEST}" >> $GITHUB_OUTPUT

      - name: Compare build vs last published digest
        id: compare
        env:
          BUILD_DIGEST: ${{ steps.build_digest.outputs.build_digest }}
          LAST_DIGEST: ${{ steps.last_digest.outputs.last_digest }}
          IS_FIRST_RELEASE: ${{ steps.last_version.outputs.is_first_release }}
        run: |
          if [ "$IS_FIRST_RELEASE" = "true" ]; then
            echo "🆕 Primera release - no hay versión anterior para comparar"
            echo "has_new_image=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ -z "$LAST_DIGEST" ]; then
            echo "⚠️ No se pudo obtener digest de última versión - asumiendo imagen nueva"
            echo "has_new_image=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "🔍 Comparando digests:"
          echo "   Build (kpack):    ${BUILD_DIGEST:0:20}..."
          echo "   Última versión:   ${LAST_DIGEST:0:20}..."
          
          if [ "$BUILD_DIGEST" = "$LAST_DIGEST" ]; then
            echo "❌ La imagen de kpack es IGUAL a la última publicada"
            echo "❌ No hay build nuevo. Cancelando publicación."
            echo "has_new_image=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ Hay una imagen nueva distinta. Se puede publicar."
          echo "has_new_image=true" >> $GITHUB_OUTPUT

  tag-image:
    needs: [versioning, check-digest]
    if: needs.check-digest.outputs.has_new_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_PASSWORD }}

      - name: Publish versioned image (vX.Y.Z)
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name || format('gainkode/{0}', inputs.project_name) }}
          VERSION: v${{ needs.versioning.outputs.version }}
        run: |
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          
          echo "🚀 Publicando imagen ${IMAGE_BASE}:${VERSION}"
          
          echo "📥 Pulling latest image..."
          docker pull "${IMAGE_BASE}:latest" || {
            echo "❌ Error: No se pudo hacer pull de la imagen latest"
            echo "Esto puede significar que kpack aún no ha terminado el build"
            exit 1
          }
          
          echo "🏷️  Tagging ${IMAGE_BASE}:latest -> ${IMAGE_BASE}:${VERSION}"
          docker tag "${IMAGE_BASE}:latest" "${IMAGE_BASE}:${VERSION}"
          
          echo "📤 Pushing ${IMAGE_BASE}:${VERSION}"
          docker push "${IMAGE_BASE}:${VERSION}"
          
          echo "✅ Imagen publicada exitosamente: ${IMAGE_BASE}:${VERSION}"

  update-gitops:
    needs: [versioning, check-digest, tag-image]
    if: needs.check-digest.outputs.has_new_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.GH_TOKEN }}
          path: gitops-repo

      - name: Update kustomization.yaml
        working-directory: gitops-repo
        env:
          FILE: ${{ inputs.gitops_path }}
          IMAGE_KEY: ${{ inputs.gitops_image_key }}
          VERSION_TAG: v${{ needs.versioning.outputs.version }}
        run: |
          if [ ! -f "$FILE" ]; then
            echo "❌ Error: No se encontró $FILE"
            exit 1
          fi
          
          # Actualizar newTag solo para la imagen especificada con versión semántica
          # Usar el patrón exacto del nombre de la imagen
          awk -v version_tag="$VERSION_TAG" -v image_key="$IMAGE_KEY" '
            /name: .*'"$IMAGE_KEY"'/ {
              in_target = 1
              print
              next
            }
            in_target && /newTag:/ {
              print "    newTag: " version_tag
              in_target = 0
              next
            }
            { print }
          ' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          
          echo "✅ Actualizado con versión: $VERSION_TAG"
          git diff "$FILE" || true

      - name: Commit and push
        working-directory: gitops-repo
        env:
          VERSION_TAG: v${{ needs.versioning.outputs.version }}
          PROJECT: ${{ inputs.project_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add "${{ inputs.gitops_path }}"
          
          if git diff --staged --quiet; then
            echo "ℹ️  Sin cambios"
            exit 0
          fi
          
          git commit -m "chore: update $PROJECT to $VERSION_TAG [skip ci]"
          git push origin main
          
          echo "✅ Pusheado: $VERSION_TAG"

  create-release:
    needs: [versioning, check-digest, update-gitops]
    runs-on: ubuntu-latest
    if: needs.check-digest.outputs.has_new_image == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Create GitHub Release with Changelog
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: v${{ needs.versioning.outputs.version }}
          PROJECT: ${{ inputs.project_name }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name || format('gainkode/{0}', inputs.project_name) }}
          REPO: ${{ github.repository }}
        run: |
          echo "Generating changelog for $VERSION..."
          
          PREV_TAG=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s (%h)' "$VERSION" 2>/dev/null || echo "- Initial release")
          else
            CHANGELOG=$(git log --pretty=format:'- %s (%h)' "$PREV_TAG..$VERSION" 2>/dev/null || echo "- No changes")
          fi
          
          cat > /tmp/release_notes.md << EOF
          ## 🚀 What's Changed
          
          $CHANGELOG
          
          ## 📦 Docker Images
          
          \`\`\`bash
          docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION}
          docker pull ${REGISTRY}/${IMAGE_NAME}:${{ needs.versioning.outputs.sha_short }}
          \`\`\`
          
          **Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${VERSION}
          EOF
          
          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "Release $VERSION" \
            --notes-file /tmp/release_notes.md
          
          echo "GitHub Release created: $VERSION"

  notify:
    needs: [versioning, check-digest, tag-image, update-gitops, create-release]
    if: always()
    uses: ./.github/workflows/notify-all.yml
    with:
      workflow_status: ${{ (needs.versioning.result == 'success' && needs.check-digest.result == 'success' && (needs.tag-image.result == 'success' || needs.tag-image.result == 'skipped') && (needs.update-gitops.result == 'success' || needs.update-gitops.result == 'skipped') && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')) && 'success' || 'failure' }}
      version: ${{ needs.versioning.outputs.version != '' && format('v{0}', needs.versioning.outputs.version) || 'N/A' }}
      project_name: ${{ inputs.project_name }}
      build_duration: ${{ 'N/A' }}
      commit_message: ${{ format('{0}{1}', (needs.check-digest.outputs.has_new_image == 'false' && '⚠️ Imagen sin cambios - ' || ''), github.event.head_commit.message || 'Manual workflow dispatch') }}
      branch_name: ${{ github.ref_name }}
      repository: ${{ github.repository }}
      run_id: ${{ github.run_id }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

